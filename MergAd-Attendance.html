<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MergAd Attendance 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#16202A; --muted:#5A6570; --line:#D3D9D0; --line-2:#E4E8E1;
  --wfo:#D2E7DD; --wfo-ink:#1F5E4F; --wfh:#D8DCF5; --wfh-ink:#3443A3; --lve:#E9A215; --lve-ink:#3A2700;
  --bt:#ECD9EF; --bt-ink:#76367F; --lop:#C4412C; --lop-ink:#FFFFFF; --hol:#DDE1DA; --hol-stripe:#CBD0C7;
  --focus:#3443A3; --maroon:#8B1E2D; --today:#FFF4D1; --today-line:#E0A21B; --danger:#B3361F; --ok:#2F7D63;
  --radius-s:4px; --radius-m:8px;
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:15px; color:var(--ink); background:var(--bg);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161B; --surface:#1A2128; --surface-2:#151B21; --ink:#E6EAE4; --muted:#9AA5AE; --line:#2C363F; --line-2:#232C34;
    --wfo:#24453B; --wfo-ink:#BFE6D6; --wfh:#2B3263; --wfh-ink:#C9CFFA; --lve:#E9A215; --lve-ink:#2A1C00;
    --bt:#47294D; --bt-ink:#F0CCF6; --hol:#242C33; --hol-stripe:#2E3840; --focus:#8E9BFF; --maroon:#E8939E; --today:#3A3014; --today-line:#E9A215;
  }
}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2128; --surface-2:#151B21; --ink:#E6EAE4; --muted:#9AA5AE; --line:#2C363F; --line-2:#232C34;
  --wfo:#24453B; --wfo-ink:#BFE6D6; --wfh:#2B3263; --wfh-ink:#C9CFFA; --bt:#47294D; --bt-ink:#F0CCF6; --hol:#242C33; --hol-stripe:#2E3840; --focus:#8E9BFF; --maroon:#E8939E; --today:#3A3014; --today-line:#E9A215;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:8px;margin-right:8px}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500}
.year-sel{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:2px 6px;font-weight:600;font-size:15px;cursor:pointer}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius-m);padding:3px}
nav.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.filebar{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.top>.brand,.top>nav.tabs{flex-shrink:0}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.status span{overflow:hidden;text-overflow:ellipsis;max-width:220px}
.status i{flex-shrink:0}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.dirty i{background:var(--lve)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--radius-m);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.link{border:0;background:none;padding:0;color:var(--wfh-ink);text-decoration:underline;text-underline-offset:2px}

main{padding:24px;max-width:1500px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input[type=search],.controls select,.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:7px 10px;min-width:0}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}

/* Today strip */
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 18px;margin-bottom:18px;display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.today .when{font-weight:600}
.today .tally{display:flex;gap:22px;flex-wrap:wrap}
.tally div{display:flex;align-items:baseline;gap:6px}
.tally strong{font-size:22px;font-weight:700}
.tally span{color:var(--muted);font-size:14px}
.today .names{color:var(--muted);font-size:14px;flex-basis:100%;margin-top:-10px}

/* Balance table */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
.scroll-x{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;min-width:860px}
table.list th,table.list td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.list thead th{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
table.list th.num,table.list td.num{text-align:right}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--surface-2)}
table.list tbody tr:last-child td{border-bottom:0}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:13px}
.who small.meta{display:flex;gap:16px;flex-wrap:wrap}
.pending{font-size:20px;font-weight:700}
.pending.low{color:var(--danger)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:500}
.meter{display:flex;gap:2px;flex-wrap:nowrap}
.meter i{display:block;width:9px;height:16px;border-radius:2px;border:1px solid var(--line);background:var(--surface)}
.meter i.half{width:5px}
.meter i.over{background:var(--lop);border-color:var(--lop)}
.meter-wrap small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
th.sortable{cursor:pointer;user-select:none}
th.sortable[aria-sort]::after{content:" ▾";font-size:11px}
th.sortable[aria-sort="ascending"]::after{content:" ▴"}

/* Register */
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.months{display:flex;gap:2px;flex-wrap:wrap}
.months button{border:1px solid transparent;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.months button.future{opacity:.55}
.brushes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.brush{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:5px 10px 5px 6px;border-radius:var(--radius-m);cursor:pointer;font-weight:500;font-size:14px}
.brush .sw{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:700}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
kbd{font:inherit;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.reg-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:8px}
.reg-bar .controls{margin-left:auto}
.reg-bar .controls input[type=search],.reg-bar .controls select,.reg-bar .btn{padding:3px 9px;font-size:13px;height:28px}
.reg-bar .controls input[type=search]{width:150px}
.reg-bar .controls select{max-width:130px}
.reg-bar .controls{gap:6px}
.reg-title{font-size:20px;margin-right:4px;white-space:nowrap}
.reg-title span{color:var(--muted);font-weight:500}
.reg-bar .months button{padding:4px 8px;font-size:14px}
.reg-bar .brush{padding:3px 9px 3px 4px;font-size:13px;height:28px}
.reg-bar .brushes{gap:5px}
.reg-bar .brush .sw{width:16px;height:16px}
.reg-info{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
main.reg{padding:12px 20px 12px;max-width:none;display:flex;flex-direction:column;height:calc(100dvh - var(--top-h,56px))}
main.reg .grid-wrap{flex:1 1 auto;max-height:none;min-height:240px}
.grid-wrap{overflow:auto;max-height:calc(100vh - 250px);min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
table.grid th,table.grid td{padding:0;border-bottom:1px solid var(--line-2)}
table.grid thead th{position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:2px solid var(--line);height:52px;vertical-align:middle}
table.grid .nm{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;padding:4px 12px;min-width:190px;max-width:190px;border-right:1px solid var(--line)}
table.grid thead .nm{z-index:4;font-size:13px;color:var(--muted);font-weight:600}
.nm button{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-align:left;font-size:13px;display:block;max-width:166px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm button:hover{text-decoration:underline}
.nm small{color:var(--muted);font-size:11px;display:block}
th.day{width:29px;min-width:29px;cursor:pointer;padding:0;text-align:center}
th.day .dn{display:block;font-size:14px;font-weight:700;line-height:1.1;color:var(--ink)}
th.day .wd{display:block;font-size:10.5px;font-weight:500;line-height:1.2;margin-top:2px;color:var(--muted)}
th.day.we,th.day.ph{background:var(--surface-2)}
th.day.we .dn,th.day.we .wd,th.day.ph .dn,th.day.ph .wd{color:var(--maroon)}
th.day:hover{background:var(--line-2)}
th.day.now{background:var(--today-line);box-shadow:inset 0 -2px 0 var(--today-line)}
th.day.now .dn,th.day.now .wd{color:#2A1C00}
th.day.now .wd::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:#2A1C00;margin:2px auto 0}
td.d{width:29px;min-width:29px;padding:2px 1px}
td.d.we,td.d.ph{background:var(--surface-2)}
td.d.now{background:var(--today);position:relative}
td.d.now::after{content:"";position:absolute;top:0;bottom:-1px;left:0;right:0;border-left:2px solid var(--today-line);border-right:2px solid var(--today-line);pointer-events:none;z-index:1}
.h{height:14px;margin:1px 1px;border-radius:2px;cursor:pointer;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;user-select:none;border:1px solid var(--line-2);background:var(--surface)}
.h:hover{outline:2px solid var(--focus);outline-offset:0}
.h.WFO{background:var(--wfo);color:var(--wfo-ink);border-color:transparent}
.h.WFH{background:var(--wfh);color:var(--wfh-ink);border-color:transparent}
.h.LVE{background:var(--lve);color:var(--lve-ink);border-color:transparent}
.h.BT{background:var(--bt);color:var(--bt-ink);border-color:transparent}
.h.LOP{background:var(--lop);color:var(--lop-ink);border-color:transparent}
.h.HOL{background:repeating-linear-gradient(135deg,var(--hol) 0 3px,var(--hol-stripe) 3px 5px);border-color:transparent}
.h.blank-due{border-color:var(--lve);border-style:dashed}
.h.off{background:none;border:0;cursor:not-allowed;outline:0}
.h.off::after{content:"";width:60%;height:1px;background:var(--line)}
.sw.WFO{background:var(--wfo);color:var(--wfo-ink)}.sw.WFH{background:var(--wfh);color:var(--wfh-ink)}.sw.LVE{background:var(--lve);color:var(--lve-ink)}
.sw.BT{background:var(--bt);color:var(--bt-ink)}.sw.LOP{background:var(--lop);color:var(--lop-ink)}
.sw.HOL{background:repeating-linear-gradient(135deg,var(--hol) 0 3px,var(--hol-stripe) 3px 5px)}
.sw.CLR{background:var(--surface);border:1px dashed var(--muted)}
th.s,td.s{width:74px;min-width:74px;max-width:74px;text-align:right;padding:4px 10px;font-size:13px;border-left:1px solid var(--line-2)}
th.s{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.25;white-space:normal;text-align:right}
th.s.first,td.s.first{border-left:1px solid var(--line)}
td.s.key{font-weight:700}
td.s.neg{color:var(--danger);font-weight:700}
td.s.lop{color:var(--lop);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Dialogs */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);max-width:min(860px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 40px)}
dialog.narrow{max-width:min(500px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(16,22,28,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px 12px;border-bottom:1px solid var(--line-2)}
.dlg-body{padding:18px 22px;overflow:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line-2)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.facts{color:var(--muted);font-size:14px;margin-top:4px}
.bignums{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:18px}
.bignums div{display:flex;flex-direction:column}
.bignums strong{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bignums span{color:var(--muted);font-size:13px}
.explain{background:var(--surface-2);border-radius:var(--radius-m);padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:18px}
table.mini{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
table.mini th,table.mini td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:right}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini thead th{font-size:12px;color:var(--muted);font-weight:600}
table.mini tfoot td{font-weight:700;border-bottom:0}
table.mini tr.na td{color:var(--line)}
.leave-dates{margin-top:18px}
.leave-dates p{margin:4px 0;font-size:14px}
.leave-dates b{display:inline-block;min-width:40px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field.full{grid-column:1/-1}
.preview{grid-column:1/-1;background:var(--surface-2);border-radius:var(--radius-m);padding:10px 14px;font-size:14px}
.preview.warn{background:#FBE9E5;color:#7A2414}

/* People & holidays */
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:20px;align-items:start}
.panel{padding:18px 20px}
.panel p{margin:8px 0;font-size:14px;color:var(--muted)}
.panel .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.panel .row .field{flex:1;min-width:110px}
.status-pill{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--wfo);color:var(--wfo-ink);font-weight:600}
.status-pill.left{background:var(--hol);color:var(--muted)}
.status-pill.soon{background:var(--wfh);color:var(--wfh-ink)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px 10px 18px;border-radius:var(--radius-m);display:flex;gap:14px;align-items:center;z-index:60;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer}
.toast[hidden]{display:none}
.banner{background:var(--surface);border:1px solid var(--lve);border-left-width:4px;border-radius:var(--radius-m);padding:12px 16px;margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner p{margin:0;flex:1;min-width:240px}

@media (max-width:820px){
  .top{padding:10px 14px;gap:10px;position:static;flex-wrap:wrap}
  main{padding:14px}
  .two{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .filebar{margin-left:0}
  .grid-wrap{max-height:none}
  main.reg{height:auto}
  main.reg .grid-wrap{max-height:75vh}
  .reg-info{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>MergAd attendance</b><select id="yearSel" class="year-sel" aria-label="Year"></select></div>
  <nav class="tabs" aria-label="Sections">
    <button data-view="balances">Leave balances</button>
    <button data-view="register">Monthly register</button>
    <button data-view="people">People</button>
    <button data-view="holidays">Holidays &amp; policy</button>
  </nav>
  <div class="filebar">
    <span class="status" id="status" role="status"><i></i><span></span></span>
    <button class="btn" id="openBtn" title="Load an attendance JSON file">Open file</button>
    <button class="btn primary" id="saveBtn" title="Ctrl+S">Save to file</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</header>
<main id="main"></main>

<dialog id="dlg"></dialog>

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){if(n==null||n==='')return '';const r=Math.round(n*100)/100;return Number.isInteger(r)?String(r):String(r)}
function nice(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return `${d} ${MON[m-1]} ${y}`}
function niceShort(iso){const [,m,d]=iso.split('-').map(Number);return `${WD[dow(iso)]} ${d} ${MON[m-1]}`}
function holMap(){const m={};(data.holidays||[]).forEach(h=>m[h.date]=h.name);return m}
let HOLS = {};
function isWeekend(iso){const w=dow(iso);return w===0||w===6}
function isOffDay(iso){return isWeekend(iso)||!!HOLS[iso]}
function emp(id){return data.employees.find(e=>e.id===id)}
function isActive(e,iso){return iso>=e.doj && (!e.lwd || iso<=e.lwd)}
function activeInMonth(e,ym){const s=ym+'-01', en=ym+'-'+pad(dim(ym));return e.doj<=en && (!e.lwd || e.lwd>=s)}
function arr(eid,ym,create){
  const a=data.attendance[eid]||(create?(data.attendance[eid]={}):null); if(!a) return null;
  if(!a[ym] && create) a[ym]=new Array(dim(ym)*2).fill(null);
  return a[ym]||null;
}
function managers(){return [...new Set(data.employees.map(e=>e.manager).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}

/* ---------- leave rules ---------- */
function autoEntitlement(e){
  const Y=data.year, A=+data.settings.annualLeave||24, cut=+data.settings.midMonthCutoff||15;
  const [y,m,d]=e.doj.split('-').map(Number);
  if(y<Y) return A; if(y>Y) return 0;
  const per=A/12;
  return (12-m)*per + (d<=cut?per:per/2);
}
function getOverride(e){const v=data.leaveOverrides[e.id];return (v===undefined||v===null||v===''||isNaN(+v))?null:+v}
function entitlement(e){
  if(e.id&&getOverride(e)!==null) return getOverride(e);
  return autoEntitlement(e);
}
function entitlementWhy(e){
  if(getOverride(e)!==null) return `Set manually to ${fmt(getOverride(e))} days (automatic rule would give ${fmt(autoEntitlement(e))}).`;
  const Y=data.year, A=+data.settings.annualLeave, cut=+data.settings.midMonthCutoff;
  const [y,m,d]=e.doj.split('-').map(Number);
  if(y<Y) return `Joined before ${Y}, so the full ${fmt(A)} days apply.`;
  const per=A/12, rest=12-m;
  return `Joined ${nice(e.doj)}: ${fmt(per)} days for each of the ${rest} months after ${MONTHS[m-1]}, plus ${fmt(d<=cut?per:per/2)} for ${MONTHS[m-1]} itself (${d<=cut?'joined on or before':'joined after'} the ${cut}th) = ${fmt(entitlement(e))} days.`;
}

function monthCounts(e,ym){
  const a=arr(e.id,ym,false), n=dim(ym);
  const c={WFO:0,WFH:0,LVE:0,BT:0,LOP:0,HOL:0,active:0,unmarked:0};
  for(let d=1;d<=n;d++){
    const iso=`${ym}-${pad(d)}`; if(!isActive(e,iso)) continue; c.active++;
    for(let k=0;k<2;k++){
      const v=a?a[(d-1)*2+k]:null;
      if(v && c[v]!==undefined) c[v]++;
      else if(!v && !isOffDay(iso) && iso<=TODAY) c.unmarked++;
    }
  }
  return c;
}
/* Mirrors the sheet columns:
   Leave Available = entitlement - leaves taken in earlier months
   Total Leaves    = LVE half-days / 2
   Leave Balance   = Leave Available - Total Leaves
   Total WFO       = (office + business-travel half-days) / 2
   Total WFH       = WFH half-days / 2
   Total LOP       = leave taken beyond the entitlement + days marked LOP
   Salary Days     = calendar days employed in the month - LOP */
function yearStats(e){
  const ent=entitlement(e); let cum=0; const months=[]; const tot={lve:0,wfo:0,wfh:0,lop:0,salary:0,unmarked:0};
  for(let m=1;m<=12;m++){
    const ym=ymOf(m);
    if(!activeInMonth(e,ym)){months.push(null);continue}
    const c=monthCounts(e,ym);
    const lve=c.LVE/2, avail=ent-cum, bal=avail-lve;
    const lopLeave=Math.max(0,cum+lve-ent)-Math.max(0,cum-ent);
    const lop=lopLeave+c.LOP/2;
    const salary=c.active-lop;
    const row={m,avail,lve,bal,wfo:(c.WFO+c.BT)/2,wfh:c.WFH/2,lop,salary,unmarked:c.unmarked/2,active:c.active};
    months.push(row); cum+=lve;
    tot.lve+=lve; tot.wfo+=row.wfo; tot.wfh+=row.wfh; tot.lop+=lop; tot.salary+=salary; tot.unmarked+=row.unmarked;
  }
  return {ent,taken:cum,pending:Math.max(0,ent-cum),over:Math.max(0,cum-ent),months,tot};
}

/* ---------- data integrity ---------- */
function ensureHolidays(){
  HOLS=holMap();
  for(const e of data.employees){
    for(let m=1;m<=12;m++){
      const ym=ymOf(m); if(!activeInMonth(e,ym)) continue;
      const a=arr(e.id,ym,true), n=dim(ym);
      if(a.length!==n*2){a.length=n*2;for(let i=0;i<a.length;i++) if(a[i]===undefined) a[i]=null}
      for(let d=1;d<=n;d++){
        const iso=`${ym}-${pad(d)}`;
        if(isActive(e,iso)&&isOffDay(iso)){ if(!a[(d-1)*2]) a[(d-1)*2]='HOL'; if(!a[(d-1)*2+1]) a[(d-1)*2+1]='HOL'; }
      }
    }
  }
}
function validate(d){
  if(!d||typeof d!=='object') return 'The file is not valid JSON data.';
  if(!Array.isArray(d.employees)) return 'This file has no employees list, so it is not an attendance file.';
  if(d.years){ if(typeof d.years!=='object') return 'The years section of this file is damaged.'; }
  else { if(!d.attendance||typeof d.attendance!=='object') return 'This file has no attendance section.';
         if(!d.year) return 'This file does not say which year it covers.'; }
  return null;
}
const OFFICIAL_HOLIDAYS={2026:[
  ['2026-01-01',"New Year's Day"],['2026-01-15','Pongal'],['2026-01-26','Republic Day'],['2026-05-01','May Day'],
  ['2026-05-28','Bakrid (Id-ul-Zuha)'],['2026-10-02','Gandhi Jayanti'],['2026-10-19','Ayudha Pooja'],['2026-10-20','Vijayadashami'],
  ['2026-11-09','Diwali/Deepavali'],['2026-12-25','Christmas']]};
const HOLIDAY_LIST_VERSION=2;
/* Adds the official government holiday list to data saved by an older version of this page. Runs once per file. */
function mergeOfficialHolidays(d){
  let changedAny=false;
  Object.keys(OFFICIAL_HOLIDAYS).forEach(y=>{
    const yo=d.years[y]; if(!yo||(yo.holidayListVersion||1)>=HOLIDAY_LIST_VERSION) return;
    OFFICIAL_HOLIDAYS[y].forEach(([date,name])=>{const h=yo.holidays.find(x=>x.date===date); if(h) h.name=name; else yo.holidays.push({date,name})});
    yo.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    yo.holidayListVersion=HOLIDAY_LIST_VERSION; changedAny=true;
  });
  return changedAny;
}
/* Version 2 file layout: one file holds every year.
   { employees:[...shared...], settings, years:{ "2026":{holidays,attendance,leaveOverrides}, "2027":{...} }, year:<last viewed> }
   Leave never carries forward: each year starts from the full allowance. */
function upgrade(d){
  let up=false;
  if(!d.years){
    const y=String(d.year||new Date().getFullYear());
    d.years={[y]:{holidays:d.holidays||[],attendance:d.attendance||{},leaveOverrides:{},holidayListVersion:d.holidayListVersion||1}};
    delete d.holidays; delete d.attendance; delete d.holidayListVersion; up=true;
  }
  const y0=Object.keys(d.years).sort()[0];
  (d.employees||[]).forEach(e=>{
    if(e.leaveOverride!==undefined){ if(e.leaveOverride!==null&&e.leaveOverride!==''){const yo=d.years[y0];yo.leaveOverrides=yo.leaveOverrides||{};yo.leaveOverrides[e.id]=+e.leaveOverride} delete e.leaveOverride; up=true }
  });
  Object.values(d.years).forEach(yo=>{yo.holidays=yo.holidays||[];yo.attendance=yo.attendance||{};yo.leaveOverrides=yo.leaveOverrides||{}});
  d.version=2;
  return up;
}
function newYearObj(y){return {holidays:(OFFICIAL_HOLIDAYS[y]||[]).map(([date,name])=>({date,name})),attendance:{},leaveOverrides:{},holidayListVersion:HOLIDAY_LIST_VERSION}}
/* data.holidays / data.attendance always point at the selected year; they are not written to the file twice. */
function link(d){
  ['holidays','attendance','leaveOverrides'].forEach(k=>Object.defineProperty(d,k,{configurable:true,enumerable:false,get(){return this.years[this.year][k]},set(v){this.years[this.year][k]=v}}));
}
function selectYear(d,y){
  y=String(y); let created=false;
  if(!d.years[y]){d.years[y]=newYearObj(y);created=true}
  d.year=+y; return created;
}
/* Prepares loaded data. Opens the current calendar year automatically, creating it when a new year begins. */
function prepare(d){
  d=normalise(d);
  let changedAny=upgrade(d);
  link(d);
  changedAny=mergeOfficialHolidays(d)|changedAny;
  changedAny=migrateNames(d)|changedAny;
  const cy=new Date().getFullYear(), maxY=Math.max(...Object.keys(d.years).map(Number));
  let target=d.years[cy]||cy>maxY?cy:(d.years[d.year]?d.year:maxY);
  if(selectYear(d,target)) changedAny=true;
  return {d,changed:!!changedAny};
}
function titleCase(s){return String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s.\-'(])([a-z])/g,(m,p,c)=>p+c.toUpperCase())}
/* One-time: converts names from the sheet (many in CAPITALS) to Title Case. */
function migrateNames(d){if((d.nameCaseVersion||0)>=1)return false;d.employees.forEach(e=>e.name=titleCase(e.name));d.nameCaseVersion=1;return true}
function normalise(d){
  d.settings=Object.assign({annualLeave:24,midMonthCutoff:15},d.settings||{});
  d.employees.forEach(e=>{e.lwd=e.lwd||null; e.note=e.note||''});
  return d;
}

/* ---------- persistence ---------- */
function serialize(){
  data.savedAt=new Date().toISOString().slice(0,19);
  return JSON.stringify(data,null,1).replace(/\[\s+([^\[\]{}]*?)\s+\]/g,(m,inner)=>'['+inner.replace(/\s*\n\s*/g,'')+']');
}
function cacheLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){}}
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('mergad-attendance',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbSet(k,v){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

let saveTimer=null;
function changed(){
  st.dirty=true; cacheLocal(); setStatus();
  if(st.fileHandle){clearTimeout(saveTimer);saveTimer=setTimeout(()=>writeFile(false),700)}
}
async function writeFile(interactive){
  if(!st.fileHandle) return false;
  try{
    if(st.fileHandle.queryPermission && (await st.fileHandle.queryPermission({mode:'readwrite'}))!=='granted'){
      if(!interactive) {setStatus('Click "Save to file" to allow saving');return false}
      if((await st.fileHandle.requestPermission({mode:'readwrite'}))!=='granted') return false;
    }
    const w=await st.fileHandle.createWritable(); await w.write(serialize()); await w.close();
    st.dirty=false; st.lastSaved=new Date(); cacheLocal(); setStatus(); return true;
  }catch(err){ setStatus('Could not write the file: '+err.message); return false }
}
async function saveNow(){
  if(st.fileHandle){ if(await writeFile(true)) toast(`Saved to ${st.fileName}`); return }
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({suggestedName:'attendance.json',types:[{description:'Attendance data',accept:{'application/json':['.json']}}]});
      st.fileHandle=h; st.fileName=h.name; idbSet('handle',h);
      if(await writeFile(true)) toast(`Saved to ${h.name}. Changes now save to this file automatically.`);
    }catch(e){ if(e.name!=='AbortError') toast('Could not save: '+e.message) }
    return;
  }
  const blob=new Blob([serialize()],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='attendance.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  st.dirty=false; st.lastSaved=new Date(); setStatus(); toast('Downloaded attendance JSON. Replace your old file with it.');
}
async function openFile(){
  if(st.dirty && !confirm('You have changes that are not saved to a file yet. Open another file anyway?')) return;
  if(window.showOpenFilePicker){
    try{
      const [h]=await showOpenFilePicker({types:[{description:'Attendance data',accept:{'application/json':['.json']}}]});
      const text=await (await h.getFile()).text();
      if(loadText(text,h.name)){ st.fileHandle=h; st.fileName=h.name; idbSet('handle',h); st.dirty=false; st.lastSaved=new Date(); setStatus(); toast(`Opened ${h.name}. Changes save to it automatically.`) }
    }catch(e){ if(e.name!=='AbortError') toast('Could not open: '+e.message) }
  } else document.getElementById('fileInput').click();
}
document.getElementById('fileInput').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  if(loadText(await f.text(),f.name)){st.fileHandle=null;st.fileName=f.name;st.dirty=false;setStatus();toast(`Loaded ${f.name}. Use "Save to file" to download the updated copy.`)}
  ev.target.value='';
});
function loadText(text,name){
  let d; try{d=JSON.parse(text)}catch(e){alert(`${name} is not valid JSON: ${e.message}`);return false}
  const err=validate(d); if(err){alert(`${name}: ${err}`);return false}
  const p=prepare(d); data=p.d; st.undo=[]; st.month=null; ensureHolidays(); cacheLocal(); pickMonth(); render(); if(p.changed) setTimeout(()=>{changed();toast('Updated this file to the latest format.')},0); return true;
}
function setStatus(msg){
  const el=document.getElementById('status'); el.classList.toggle('dirty',st.dirty||!!msg);
  let t, full;
  const time=st.lastSaved?st.lastSaved.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
  if(msg){t=msg;full=msg}
  else if(st.fileHandle){t=st.dirty?'Saving…':(time?`Saved ${time}`:'File connected');full=st.dirty?`Saving to ${st.fileName}`:`Saved to ${st.fileName}${time?' at '+time:''}`}
  else{t=st.dirty?'Not saved to file':'No file connected';full=st.dirty?'Changes are kept in this browser. Click "Save to file" to write them to your JSON file.':'Click "Open file" to connect your attendance JSON file.'}
  el.querySelector('span').textContent=t; el.title=full;
}
window.addEventListener('beforeunload',e=>{if(st.dirty&&!st.fileHandle){e.preventDefault();e.returnValue=''}});

/* ---------- undo & toast ---------- */
function snapshot(){st.undo.push(JSON.stringify({y:data.year,a:data.attendance,h:data.holidays,e:data.employees,o:data.leaveOverrides}));if(st.undo.length>40)st.undo.shift()}
function undo(){const s=st.undo.pop();if(!s){toast('Nothing to undo');return}const o=JSON.parse(s);if(o.y!==data.year){st.undo=[];toast('Undo only works within the same year.');return}data.attendance=o.a;data.holidays=o.h;data.employees=o.e;data.leaveOverrides=o.o||{};HOLS=holMap();changed();render();hideToast()}
let toastTimer;
function toast(msg,withUndo){const t=document.getElementById('toast');t.querySelector('span').textContent=msg;document.getElementById('toastUndo').hidden=!withUndo;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,withUndo?7000:3500)}
function hideToast(){document.getElementById('toast').hidden=true}
document.getElementById('toastUndo').onclick=undo;

/* ---------- filters ---------- */
function filtered(list){
  const q=st.q.trim().toLowerCase();
  return list.filter(e=>(!st.mgr||e.manager===st.mgr)&&(!q||e.name.toLowerCase().includes(q)));
}
function refDate(){const y=String(data.year);return TODAY.startsWith(y)?TODAY:(TODAY>y?`${y}-12-31`:`${y}-01-01`)}
function activeInYear(e){const y=data.year;return e.doj<=`${y}-12-31`&&(!e.lwd||e.lwd>=`${y}-01-01`)}
function isCurrent(e){return !e.lwd||e.lwd>=refDate()}

/* ---------- render: shell ---------- */
const main=document.getElementById('main');
function yearList(){
  const ys=new Set(Object.keys(data.years).map(Number)); const cy=new Date().getFullYear();
  const maxY=Math.max(cy,...ys); ys.add(maxY+1);
  for(let y=Math.min(...ys);y<=maxY+1;y++) ys.add(y);
  return [...ys].sort((a,b)=>a-b);
}
function renderYearSel(){
  const s=document.getElementById('yearSel');
  s.innerHTML=yearList().map(y=>`<option value="${y}" ${y===data.year?'selected':''}>${y}${data.years[y]?'':' (new)'}</option>`).join('');
}
function switchYear(y){
  const isNew=!data.years[y];
  if(isNew&&!confirm(`Start ${y}? Everyone employed in ${y} gets a fresh leave allowance. Unused leave from earlier years does not carry forward.`)){renderYearSel();return}
  selectYear(data,y); st.undo=[]; st.month=null; ensureHolidays(); pickMonth();
  if(isNew) changed(); else cacheLocal();
  render();
  if(isNew) toast(`Started ${y}. ${data.holidays.length?'Government holidays are already added.':'Add the '+y+' government holidays in Holidays & policy.'}`);
}
document.getElementById('yearSel').addEventListener('change',e=>switchYear(+e.target.value));
function render(){
  main.classList.toggle('reg',st.view==='register');
  renderYearSel();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.view===st.view?'page':'false'));
  ({balances:renderBalances,register:renderRegister,people:renderPeople,holidays:renderHolidays})[st.view]();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;render()});

function controlsHTML(extra=''){
  return `<div class="controls">
    <input type="search" id="q" placeholder="Search people" value="${esc(st.q)}" aria-label="Search people">
    <select id="mgr" aria-label="Filter by manager"><option value="">All managers</option>${managers().map(m=>`<option ${m===st.mgr?'selected':''}>${esc(m)}</option>`).join('')}</select>
    ${extra}</div>`;
}
function bindControls(rerender){
  const q=document.getElementById('q'); q.oninput=()=>{st.q=q.value;rerender(true)};
  document.getElementById('mgr').onchange=e=>{st.mgr=e.target.value;rerender()};
}

/* ---------- view: balances ---------- */
function todayHTML(){
  if(!TODAY.startsWith(String(data.year))) return '';
  const ym=TODAY.slice(0,7), d=+TODAY.slice(8), idx=(d-1)*2;
  if(isOffDay(TODAY)) return `<section class="today"><span class="when">Today, ${niceShort(TODAY)}</span><span class="names" style="margin:0;flex-basis:auto">${esc(HOLS[TODAY]||'Weekend')}. No one is expected in.</span></section>`;
  const g={WFO:[],WFH:[],LVE:[],BT:[],LOP:[],none:[]};
  data.employees.filter(e=>isActive(e,TODAY)).forEach(e=>{
    const a=arr(e.id,ym,false)||[]; const v=a[idx]||a[idx+1]; const pick=(a[idx]==='LVE'||a[idx+1]==='LVE')?'LVE':v;
    (g[pick]||g.none).push(e.name);
  });
  const names=[g.LVE.length?`On leave: ${g.LVE.map(esc).join(', ')}`:'', g.WFH.length?`Home: ${g.WFH.map(esc).join(', ')}`:''].filter(Boolean).join('. ');
  return `<section class="today" aria-label="Today">
    <span class="when">Today, ${niceShort(TODAY)}</span>
    <div class="tally">
      <div><strong>${g.WFO.length+g.BT.length}</strong><span>in office</span></div>
      <div><strong>${g.WFH.length}</strong><span>from home</span></div>
      <div><strong>${g.LVE.length+g.LOP.length}</strong><span>on leave</span></div>
      ${g.none.length?`<div><strong>${g.none.length}</strong><span>not marked yet</span> <button class="btn link" id="goToday">Mark today</button></div>`:''}
    </div>
    ${names?`<div class="names">${names}</div>`:''}
  </section>`;
}
function meterHTML(s){
  const n=Math.ceil(s.ent), out=[];
  for(let i=0;i<n;i++){
    const cap=Math.min(1,s.ent-i); const f=Math.max(0,Math.min(cap,s.taken-i))/cap*100;
    out.push(`<i class="${cap<1?'half':''}" style="background:linear-gradient(to top,var(--lve) ${f}%,var(--surface) ${f}%);${f>0?'border-color:var(--lve)':''}"></i>`);
  }
  for(let i=0;i<Math.ceil(s.over);i++) out.push('<i class="over" title="Beyond entitlement, counted as loss of pay"></i>');
  return `<div class="meter" aria-hidden="true">${out.join('')}</div>`;
}
function renderBalances(keepFocus){
  let list=filtered(data.employees).filter(activeInYear).filter(e=>st.former||isCurrent(e)).map((e,i)=>({e,s:yearStats(e),i}));
  const k=st.sort, dir=st.sortDir;
  list.sort((a,b)=>{
    const v=k==='order'?a.i-b.i:k==='name'?a.e.name.localeCompare(b.e.name):k==='pending'?a.s.pending-b.s.pending:k==='taken'?a.s.taken-b.s.taken:k==='ent'?a.s.ent-b.s.ent:k==='wfh'?a.s.tot.wfh-b.s.tot.wfh:k==='wfo'?a.s.tot.wfo-b.s.tot.wfo:a.s.tot.lop-b.s.tot.lop;
    return v*dir;
  });
  const formerCount=data.employees.filter(e=>activeInYear(e)&&!isCurrent(e)).length;
  const th=(key,label,num)=>`<th class="sortable ${num?'num':''}" data-sort="${key}" ${st.sort===key?`aria-sort="${dir>0?'ascending':'descending'}"`:''}>${label}</th>`;
  main.innerHTML=`
    <div class="head">
      <div><h1>Leave balances, ${data.year}</h1><p class="sub">${fmt(+data.settings.annualLeave)} days a year, starting fresh each January. People who join during the year get a share for the months left. Names are in the same order as the sheet. Click a name for the month-by-month breakdown.</p></div>
      ${controlsHTML(`<label class="check"><input type="checkbox" id="former" ${st.former?'checked':''}> Show people who left (${formerCount})</label>`)}
    </div>
    ${todayHTML()}
    <div class="card scroll-x">

/* ---------- view: register ---------- */
function pickMonth(){
  if(st.month && st.month.startsWith(String(data.year))) return;

const SUMCOLS=[['avail','Leave available'],['lve','Total leaves'],['bal','Leave balance'],['wfo','Total WFO'],['wfh','Total WFH'],['lop','Total LOP'],['salary','Salary days']];
function summaryCells(e,ym){
  const s=yearStats(e), r=s.months[+ym.slice(5)-1];
  if(!r) return SUMCOLS.map((c,i)=>`<td class="s ${i?'':'first'}"></td>`).join('');
  return SUMCOLS.map(([k],i)=>{
    const v=r[k]; let cls='s'+(i?'':' first');

    if(k==='lop'&&v>0) cls+=' lop';
    return `<td class="${cls}" data-k="${k}">${fmt(v)}</td>`;
  }).join('');
}
function cellTitle(e,iso,k,v){return `${e.name}, ${niceShort(iso)} ${k?'afternoon':'morning'}: ${v?CODES[v].label:'not marked'}`}
function cellClass(e,iso,v){
  if(!isActive(e,iso)) return 'h off';
  return 'h'+(v?' '+v:'')+(!v&&!isOffDay(iso)&&iso<=TODAY?' blank-due':'');
}
function renderRegister(){

  }

    </div>
    <div class="reg-bar">
      <div class="brushes" role="group" aria-label="Mark to apply">${BRUSHES.map((b,i)=>`<button class="brush" data-b="${b}" aria-pressed="${st.brush===b}" title="${b==='CLR'?'Remove the mark':esc(CODES[b].label+': '+CODES[b].help)} (key ${i+1}). Click a box again to remove the mark."><span class="sw ${b}">${b==='CLR'?'':CODES[b].letter}</span>${{WFO:'Office',WFH:'WFH',LVE:'Leave',BT:'Travel',LOP:'Loss of pay',HOL:'Holiday',CLR:'Clear'}[b]}</button>`).join('')}</div>
      <button class="btn" id="undoBtn" title="Ctrl+Z" ${st.undo.length?'':'disabled'}>Undo</button>
      ${controlsHTML(`<button class="btn" id="csvBtn" title="Download this month's totals as a CSV file">Export CSV</button>`)}
    </div>
    <div class="grid-wrap" id="gridWrap">${rows.length?`<table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`:`<div class="empty">No one was employed in ${MONTHS[mi-1]} with these filters.</div>`}</div>`;
  bindControls(r=>{renderRegister();if(r){const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
  main.querySelectorAll('.months button').forEach(b=>b.onclick=()=>{st.month=ymOf(+b.dataset.m);renderRegister()});
  main.querySelectorAll('.brush').forEach(b=>b.onclick=()=>setBrush(b.dataset.b));
  document.getElementById('undoBtn').onclick=undo;

  main.querySelectorAll('.nm button[data-open]').forEach(b=>b.onclick=()=>openPerson(b.dataset.open));
  main.querySelectorAll('th.day').forEach(t=>t.onclick=()=>paintDay(+t.dataset.day));
  bindGrid();

}
function setBrush(b){st.brush=b;document.querySelectorAll('.brush').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===b))}
let painting=false, touchedRows=new Set(), lastPointer='mouse', strokeVal=null;
/* Clicking a box that already has the selected mark clears it; a drag that starts there clears matching boxes. */
function startStroke(el){const b=st.brush==='CLR'?null:st.brush;const a=arr(el.dataset.e,st.month,true);strokeVal=(b&&a[+el.dataset.i]===b)?null:b}
function applyCell(el){
  if(el.classList.contains('off')) return;
  const e=emp(el.dataset.e), i=+el.dataset.i, a=arr(e.id,st.month,true);
  const v=strokeVal;
  if(a[i]===v) return;
  if(v===null && st.brush!=='CLR' && a[i]!==st.brush) return; // erasing stroke only removes the selected mark
  a[i]=v;
  const iso=`${st.month}-${pad(Math.floor(i/2)+1)}`;
  el.className=cellClass(e,iso,v); el.textContent=v?CODES[v].letter:''; el.title=cellTitle(e,iso,i%2,v);
  touchedRows.add(e.id);
}
function refreshRows(){
  touchedRows.forEach(id=>{
    const tr=main.querySelector(`tr[data-row="${id}"]`); if(!tr) return;
    tr.querySelectorAll('td.s').forEach(td=>td.remove());
    tr.insertAdjacentHTML('beforeend',summaryCells(emp(id),st.month));
  });
  const ub=document.getElementById('undoBtn'); if(ub) ub.disabled=!st.undo.length;
  touchedRows.clear();
}
function bindGrid(){
  const g=main.querySelector('table.grid'); if(!g) return;
  g.addEventListener('pointerdown',ev=>{
    lastPointer=ev.pointerType;
    const h=ev.target.closest('.h'); if(!h||h.classList.contains('off')||ev.pointerType==='touch') return;
    ev.preventDefault(); snapshot(); startStroke(h); painting=true; applyCell(h);
  });
  g.addEventListener('pointerover',ev=>{if(!painting)return;const h=ev.target.closest('.h');if(h)applyCell(h)});
  g.addEventListener('click',ev=>{
    if(lastPointer!=='touch') return;
    const h=ev.target.closest('.h'); if(!h||h.classList.contains('off')) return;
    snapshot(); startStroke(h); applyCell(h); if(touchedRows.size){refreshRows();changed()} else st.undo.pop();
  });
}
window.addEventListener('pointerup',()=>{if(!painting)return;painting=false;if(touchedRows.size){refreshRows();changed()}else st.undo.pop()});

function paintDay(d){
  const iso=`${st.month}-${pad(d)}`, v=st.brush==='CLR'?null:st.brush;
  const rows=filtered(data.employees).filter(e=>isActive(e,iso));
  if(!rows.length) return;
  snapshot();
  rows.forEach(e=>{const a=arr(e.id,st.month,true);a[(d-1)*2]=v;a[(d-1)*2+1]=v});
  changed(); renderRegister();
  toast(`${niceShort(iso)} marked as ${v?CODES[v].label:'cleared'} for ${rows.length} people.`,true);
}
function exportCSV(){
  const ym=st.month, mi=+ym.slice(5);
  const rows=[['Name','Category','Manager','DOJ',...SUMCOLS.map(c=>c[1])]];
  filtered(data.employees).filter(e=>activeInMonth(e,ym)).forEach(e=>{const r=yearStats(e).months[mi-1];rows.push([e.name,e.category,e.manager,e.doj,...SUMCOLS.map(([k])=>fmt(r[k]))])});
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`attendance-${MON[mi-1]}-${data.year}.csv`;document.body.appendChild(a);a.click();a.remove();
}

      if(f&&s) parts.push(`${d}`); else if(f) parts.push(`${d} (morning)`); else if(s) parts.push(`${d} (afternoon)`);}

          <p>Leave taken beyond the allowance is counted as loss of pay, which lowers salary days.</p>
        </div>
      </div>
    </div>`;
  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const date=b.dataset.del; snapshot();
    data.holidays=data.holidays.filter(h=>h.date!==date); HOLS=holMap();
    if(!isWeekend(date)){const ym=date.slice(0,7),i=(+date.slice(8)-1)*2;Object.values(data.attendance).forEach(a=>{if(a[ym]){if(a[ym][i]==='HOL')a[ym][i]=null;if(a[ym][i+1]==='HOL')a[ym][i+1]=null}})}
    changed(); renderHolidays(); toast(`Removed the holiday on ${nice(date)}.`,true);
  });
  document.getElementById('hAdd').onclick=()=>{
    const date=document.getElementById('hD').value, name=document.getElementById('hN').value.trim()||'Public holiday';
    if(!date||!date.startsWith(String(data.year))){alert(`Pick a date in ${data.year}.`);return}
    if(HOLS[date]){alert(`${nice(date)} is already a holiday (${HOLS[date]}).`);return}
    snapshot(); data.holidays.push({date,name}); HOLS=holMap();
    const ym=date.slice(0,7),i=(+date.slice(8)-1)*2;
    data.employees.forEach(e=>{if(isActive(e,date)){const a=arr(e.id,ym,true);a[i]='HOL';a[i+1]='HOL'}});
    changed(); renderHolidays(); toast(`Added ${name} on ${nice(date)}.`,true);
  };
  document.getElementById('pSave').onclick=()=>{
    const A=+document.getElementById('pA').value, C=+document.getElementById('pC').value;
    if(!(A>=0)||!(C>=1&&C<=31)){alert('Enter a valid number of days and a cut-off day between 1 and 31.');return}
    snapshot(); data.settings.annualLeave=A; data.settings.midMonthCutoff=C; changed(); renderHolidays(); toast('Leave policy saved.',true);
  };
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',ev=>{
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();saveNow();return}
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!typing){ev.preventDefault();undo();return}
  if(st.view==='register'&&!typing&&!dlg.open&&/^[1-7]$/.test(ev.key)) setBrush(BRUSHES[+ev.key-1]);
});
document.getElementById('saveBtn').onclick=saveNow;
document.getElementById('openBtn').onclick=openFile;

/* ---------- boot ---------- */
async function boot(){
  let src=null;
  try{const c=localStorage.getItem(LS_KEY);if(c){const d=JSON.parse(c);if(!validate(d))src=d}}catch(e){}
  if(!src) src=JSON.parse(document.getElementById('seed').textContent);
  const p=prepare(src); data=p.d; ensureHolidays(); pickMonth(); if(p.changed){st.dirty=true;cacheLocal()}
  const h=await idbGet('handle');
  if(h){st.fileHandle=h;st.fileName=h.name;st.lastSaved=null}
  setStatus(); render();
  if(h){
    const perm=h.queryPermission?await h.queryPermission({mode:'readwrite'}):'granted';
    if(perm!=='granted'){
      main.insertAdjacentHTML('afterbegin',`<div class="banner" id="reconnect"><p>Reconnect to <b>${esc(h.name)}</b> so your changes keep saving to it. The browser asks for permission once per visit.</p><button class="btn primary" id="reBtn">Reconnect file</button><button class="btn" id="reNo">Not now</button></div>`);
      document.getElementById('reBtn').onclick=async()=>{
        try{ if((await h.requestPermission({mode:'readwrite'}))==='granted'){
          const text=await (await h.getFile()).text();
          const d=JSON.parse(text);
          if(!validate(d)&&!st.dirty){const p=prepare(d);data=p.d;st.month=null;ensureHolidays();pickMonth();cacheLocal();if(p.changed)st.dirty=true}
          st.lastSaved=new Date(); setStatus(); render(); if(st.dirty) writeFile(true); toast(`Connected to ${h.name}.`);
        }}catch(e){toast('Could not reconnect: '+e.message)}
      };
      document.getElementById('reNo').onclick=()=>{document.getElementById('reconnect').remove()};
    }
  }
}
function measureTop(){document.documentElement.style.setProperty('--top-h',document.querySelector('.top').offsetHeight+'px')}
window.addEventListener('resize',measureTop);measureTop();
if(window.ResizeObserver) new ResizeObserver(measureTop).observe(document.querySelector('.top'));
boot();
})();
</script>
